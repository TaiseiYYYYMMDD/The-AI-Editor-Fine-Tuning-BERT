<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>The AI Editor</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>

<body>
  <header class="topbar">
    <div class="container topbar__inner">
      <div class="titleBlock">
        <div class="logo">AI</div>
        <div>
          <div class="appTitle">The AI Editor</div>
          <div class="appSub" data-i18n="subtitle">ニュース見出しカテゴリ分類</div>
        </div>
      </div>

      <div class="lang">
        <button class="lang__btn is-active" type="button" id="btnJa">JA</button>
        <button class="lang__btn" type="button" id="btnEn">EN</button>
      </div>
    </div>
  </header>

  <main class="container">
    <section class="panel">
      <form method="post" class="form">
        <label class="label" for="text" data-i18n="label">見出し</label>

        <div class="row">
          <input
            id="text"
            name="text"
            type="text"
            class="input"
            autocomplete="off"
            required
            value="{{ request.form.get('text','') }}"
          />
          <button class="btn" type="submit" data-i18n="btn">判定</button>
        </div>
      </form>

      <div class="resultArea">
        {% if result %}
          <div class="resultTag">
            <span class="resultTag__k" data-i18n="result">結果</span>
            <span class="resultTag__v">{{ result }}</span>
          </div>
        {% else %}
          <div class="placeholder" data-i18n="placeholder">
            見出しを入力して判定してください
          </div>
        {% endif %}
      </div>
    </section>

    <footer class="footer">
      <span>© The AI Editor</span>
    </footer>
  </main>

  <script>
    const I18N = {
      ja: {
        subtitle: "ニュース見出しカテゴリ分類",
        label: "見出し",
        btn: "判定",
        result: "結果",
        placeholder: "見出しを入力して判定してください",
        inputPlaceholder: "例：生成AIの新機能、業務効率を改善"
      },
      en: {
        subtitle: "Headline category classification",
        label: "Headline",
        btn: "Classify",
        result: "Result",
        placeholder: "Enter a headline and click Classify",
        inputPlaceholder: "e.g., New generative AI feature improves productivity"
      }
    };

    const input = document.getElementById("text");
    const btnJa = document.getElementById("btnJa");
    const btnEn = document.getElementById("btnEn");

    function applyLang(lang) {
      const dict = I18N[lang];
      document.documentElement.lang = (lang === "ja") ? "ja" : "en";

      document.querySelectorAll("[data-i18n]").forEach(el => {
        const key = el.getAttribute("data-i18n");
        if (dict[key] !== undefined) el.textContent = dict[key];
      });

      if (input) input.placeholder = dict.inputPlaceholder;

      btnJa.classList.toggle("is-active", lang === "ja");
      btnEn.classList.toggle("is-active", lang === "en");

      localStorage.setItem("lang", lang);
    }

    btnJa.addEventListener("click", () => applyLang("ja"));
    btnEn.addEventListener("click", () => applyLang("en"));

    const saved = localStorage.getItem("lang");
    applyLang(saved === "en" ? "en" : "ja");
  </script>
</body>
</html>
